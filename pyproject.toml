[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feed-filter"
version = "0.2.0"
description = "Local RSS digest filtered by a personal category taxonomy"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "feedparser>=6.0.11,<7.0",
    "requests>=2.32,<3.0",
    "PyYAML>=6.0,<7.0",
    "pydantic>=2.10,<3.0",
    "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1.0",
    "httpx>=0.28,<1.0",
]

[project.scripts]
feed-filter = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"eval/harness.py" = ["E501"]
